[package]
name = "shimeji"
version = "0.1.0"
edition = "2024"

[lib]
name = "shimeji"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.27.0"
