[package]
name = "shimeji"
version = "0.1.0"
edition = "2024"

[lib]
name = "shimeji"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
dirs-next = "2.0.0"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
rand = "0.10.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
raw-window-handle = "0.6"
tempfile = "3.27.0"
thiserror = "2.0.20"
tray-icon = "0.24"
winit = { version = "0.30", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Controls"] }
zip = "8.6.0"

[dev-dependencies]
